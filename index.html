    <style>
      :root {
        --bg: #0b0f1a;
        --fg: #e8ecf5;
        --muted: #8b93a7;
        --accent: #149ddd;
        --accent-2: #7c5cff;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.09);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Poppins", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 16px;
        overflow-x: hidden;
        position: relative;
      }
      .blob {
        position: fixed;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.35;
        z-index: 0;
        animation: drift 18s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .blob.one { background: var(--accent); top: -160px; left: -140px; }
      .blob.two { background: var(--accent-2); bottom: -180px; right: -160px; animation-delay: -9s; }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(80px, 60px) scale(1.15); }
      }
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        z-index: 0;
        pointer-events: none;
      }
      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 620px;
        text-align: center;
      }
      .avatar {
        display: block;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid transparent;
        background:
          linear-gradient(var(--bg), var(--bg)) padding-box,
          linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
        margin: 0 auto 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 22px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
        70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      h1 {
        font-size: clamp(34px, 7vw, 56px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 14px;
      }
      h1 .grad {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .role {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        color: var(--accent);
        margin-bottom: 20px;
        min-height: 1.5em;
      }
      .cursor {
        display: inline-block;
        width: 8px;
        background: var(--accent);
        margin-left: 2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      p.lead {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
        max-width: 480px;
        margin: 0 auto 32px;
      }
      .progress {
        height: 6px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        overflow: hidden;
        max-width: 360px;
        margin: 0 auto 36px;
      }
      .progress span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: load 2.6s ease-in-out infinite;
      }
      @keyframes load {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      .socials {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .socials a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--fg);
        transition: transform 0.2s, border-color 0.2s, color 0.2s;
      }
      .socials a:hover, .socials a:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      .socials svg { width: 20px; height: 20px; fill: currentColor; }
      footer {
        margin-top: 40px;
        font-size: 13px;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .progress span { width: 65%; }
      }
    </style>
  </head>

  <body>
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="grid"></div>

    <main>
      <img class="avatar" src="assets/img/my-profile-img.jpg" alt="Çağatay Türkan" />

      <div class="badge"><span class="dot"></span><span id="badge">Yapım aşamasında</span></div>

      <h1>Yeni site <span class="grad">yakında</span></h1>

        Merhaba, ben Çağatay. Yepyeni bir site üzerinde çalışıyorum.
        Kısa süre içinde burada olacak, o zamana kadar aşağıdan bana ulaşabilirsin.
      </p>

      <div class="progress" aria-hidden="true"><span></span></div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      var en = !/^tr\b/i.test(navigator.language || "");
      if (en) {
        document.documentElement.lang = "en";
        document.title = "Çağatay Türkan — Coming Soon";
        document.getElementById("badge").textContent = "Under construction";
        document.querySelector("h1").innerHTML = 'New site <span class="grad">coming soon</span>';
        document.getElementById("lead").textContent =
          "Hi, I'm Çağatay. I'm building a brand new website — it'll be here shortly. Until then, you can reach me below.";
      }

      var words = ["Computer Engineer", "Back End Developer", "AI & Chatbots", "Node.js APIs"];
      var el = document.getElementById("typed");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        el.textContent = words.join(" · ");
      } else {
        var w = 0, i = 0, del = false;
        (function tick() {
          var word = words[w];
          el.textContent = word.slice(0, i);
          if (!del && i < word.length) { i++; setTimeout(tick, 70); }
          else if (!del) { del = true; setTimeout(tick, 1600); }
          else if (i > 0) { i--; setTimeout(tick, 35); }
          else { del = false; w = (w + 1) % words.length; setTimeout(tick, 300); }
        })();
      }
    </script>
